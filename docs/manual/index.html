<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Urfael Manual</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
  <meta name="description" content="The Urfael manual: install, quickstart, features, channels, security, and the full CLI reference for the security-first personal AI you run on your own machine." />
  <link rel="icon" type="image/svg+xml" href="../media/favicon.svg" />
  <link rel="stylesheet" href="/assets/docsify-vue.css" />
  <style>
    /* Urfael: black and white, as on urfael.com. Geist, Geist Mono and Outfit (the name in the sidebar) come from the
       site's own fonts, so no visitor's address goes to a third party; /assets/docsify-vue.css is docsify's theme
       without its web fonts. */
    @font-face { font-family: "Geist"; font-style: normal; font-weight: 100 900; font-display: swap; src: url(/assets/fonts/geist-latin.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    @font-face { font-family: "Geist"; font-style: normal; font-weight: 100 900; font-display: swap; src: url(/assets/fonts/geist-latin-ext.woff2) format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
    @font-face { font-family: "Geist"; font-style: normal; font-weight: 100 900; font-display: swap; src: url(/assets/fonts/geist-arrows.woff2) format("woff2"); unicode-range: U+2190, U+2192, U+2197; }
    @font-face { font-family: "Outfit"; font-style: normal; font-weight: 100 900; font-display: swap; src: url(/assets/fonts/outfit-latin.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    @font-face { font-family: "Geist Mono"; font-style: normal; font-weight: 100 900; font-display: swap; src: url(/assets/fonts/geist-mono-latin.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    @font-face { font-family: "Geist Mono"; font-style: normal; font-weight: 100 900; font-display: swap; src: url(/assets/fonts/geist-mono-latin-ext.woff2) format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
    :root { --theme-color: #0a0a0a; --ink: #0a0a0a; --ink-2: #454545; --muted: #6b6b6b; --line: #e6e6e6; --line-2: #cfcfcf; --wash: #fafafa; --fill: #f4f4f4; }
    body { background: #ffffff; color: var(--ink-2); }
    ::selection { background: #0a0a0a; color: #ffffff; }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 2px; }
    .progress { background-color: var(--ink) !important; }
    /* the sidebar */
    .sidebar { background: var(--wash); border-right: 1px solid var(--line); }
    .sidebar a, .sidebar li, .app-name-link, .app-nav a { color: var(--ink-2) !important; }
    .sidebar-nav > ul > li > a { font-weight: 600; }
    .sidebar-nav li.active > a, .sidebar a:hover, .app-nav a:hover { color: var(--ink) !important; border-right-color: var(--ink) !important; }
    .sidebar-toggle { background: var(--wash); } .sidebar-toggle span { background-color: var(--ink); }
    /* the logo: media/urfael-logo.svg turns white under a dark system scheme, for dark pages, but the manual is white in
       every scheme, so its logo is held to the mark's black */
    .app-name-link img, .cover-main img { filter: brightness(0) invert(5.5%); }
    /* the sidebar's name is the site's lockup (.brand in site.css): the name in Outfit 600 and the mark's black, the
       mark's nominal height 1.2 em, so its 128 box 1.6 em, with its feet on the name's baseline (baseline alignment, then
       a drop of the box's empty bottom, 16 of 128). The box holds 37.5 units (0.46875 em) left of the beak and the toes,
       taken back, so its ink is centred, and 34.5 units right of the roof's point, taken back to leave the site's 26
       units (0.325 em) from the point to the U, less the U's 0.0625 em side bearing */
    .sidebar > h1 .app-name-link, .sidebar > h1 .app-name-link:hover {
      display: inline-flex; align-items: baseline; gap: 0; margin-left: -0.46875em;
      font-family: "Outfit", ui-sans-serif, system-ui, sans-serif; font-weight: 600; line-height: 1; letter-spacing: -0.01em;
      color: #0e0e0f !important;
    }
    .app-name-link img { width: 1.6em; height: 1.6em; flex: none; margin-right: -0.16875em; transform: translateY(12.5%); }
    .search input { background: #ffffff; color: var(--ink); border: 1px solid var(--line-2); }
    .search .results-panel { background: #ffffff; } .search .matching-post { border-bottom-color: var(--line); } .search .search-keyword { color: var(--ink); font-weight: 600; }
    /* the page */
    .markdown-section { color: var(--ink-2); }
    .markdown-section :is(h1, h2, h3, h4, h5, h6, strong) { color: var(--ink); font-weight: 600; letter-spacing: -0.02em; }
    .markdown-section h2 { border-bottom: 1px solid var(--line); padding-bottom: 0.3em; }
    .markdown-section a { color: var(--ink); text-decoration: underline; text-decoration-thickness: 1px; text-decoration-color: var(--line-2); text-underline-offset: 0.24em; }
    .markdown-section a:hover { text-decoration-color: currentColor; }
    .markdown-section .anchor { text-decoration: none; } .anchor span { color: var(--ink); }
    .markdown-section tr { background: transparent !important; border-top: 1px solid var(--line); }
    .markdown-section :is(th, td) { border: 1px solid var(--line); }
    .markdown-section :is(code, pre, pre > code) { background: var(--fill) !important; color: var(--ink) !important; }
    .markdown-section .token { color: var(--ink) !important; background: none !important; }
    .markdown-section .token:is(.comment, .prolog, .doctype, .cdata, .punctuation) { color: var(--muted) !important; }
    .markdown-section blockquote { border-left: 2px solid var(--ink); color: var(--ink-2); background: var(--wash); }
    .markdown-section :is(p.tip, p.warn) { background: var(--wash); border-left-color: var(--ink); color: var(--ink-2); }
    .markdown-section p.tip::before { background-color: var(--ink); color: #ffffff; }
    .docsify-copy-code-button { background: var(--ink) !important; color: #ffffff !important; }
    .docsify-pagination-container { border-top-color: var(--line) !important; } .pagination-item a, .pagination-item-title { color: var(--ink-2) !important; }
    /* the cover: white, the name in ink, a black button and an outline one */
    .cover, .cover.show { background: #ffffff !important; color: var(--ink); }
    .cover-main > h1, .cover-main a { color: var(--ink) !important; }
    section.cover .cover-main > h1 { font-weight: 600; letter-spacing: -0.04em; }
    section.cover .cover-main > p:last-child a { border: 1px solid var(--ink); border-radius: 6px; color: var(--ink); font-weight: 500; letter-spacing: -0.005em; }
    section.cover .cover-main > p:last-child a:last-child { background: var(--ink); color: #ffffff !important; }
    /* on a phone the navbar wraps to three lines over the top of the cover, so the cover starts below them */
    @media screen and (max-width: 768px) { section.cover { box-sizing: border-box; padding-top: 7.5rem; } }
    .github-corner { color: var(--ink); border-bottom: 0; } .github-corner svg { fill: var(--ink); color: #ffffff; }
  </style>
</head>
<body>
  <div id="app">Loading the Urfael manual…</div>
  <script>
    window.$docsify = {
      name: '<img src="../media/urfael-logo.svg" alt="Urfael" /> Urfael',
      nameLink: '#/',
      repo: 'https://github.com/maximilliangrand/urfael',
      loadSidebar: true,
      loadNavbar: true,
      coverpage: true,
      onlyCover: false,
      subMaxLevel: 2,
      auto2top: true,
      relativePath: false,
      maxLevel: 3,
      notFoundPage: true,
      search: {
        depth: 6,
        placeholder: 'Search the manual…',
        noData: 'Nothing found. Try the CLI reference or the FAQ.',
        pathNamespaces: ['/start', '/using', '/features', '/channels', '/security', '/guides', '/developer', '/reference'],
      },
      pagination: { crossChapter: true, crossChapterText: true },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
